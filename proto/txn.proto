syntax = "proto3";
package org.solana.sealevel.v1;

import "context.proto";
import "metadata.proto";

// Message header contains the counts of required readonly and signatures
message MessageHeader {
  uint32 num_required_signatures = 1;
  uint32 num_readonly_signed_accounts = 2;
  uint32 num_readonly_unsigned_accounts = 3;
}

// The instruction a transaction executes
message CompiledInstruction {
  // Index into the message pubkey array
  uint32 program_id_index = 1;
  // Indexes into the message pubkey array
  repeated uint32 accounts = 2;
  bytes data = 3;
}

// List of address table lookups used to load additional accounts for a transaction
message MessageAddressTableLookup {
  bytes account_key = 1;
  repeated uint32 writable_indexes = 2;
  repeated uint32 readonly_indexes = 3;
}

// Transaction message version
enum TransactionVersion {
  TRANSACTION_VERSION_V0 = 0;
  TRANSACTION_VERSION_LEGACY = 1;
  TRANSACTION_VERSION_V1 = 2;
}

// Transaction V1 configuration
message TransactionConfig {
  // Mask bits 0 and 1 (8 bytes, little-endian).
  optional uint64 priority_fee = 1;
  // Mask bit 2 (4 bytes, little-endian).
  optional uint32 compute_unit_limit = 2;
  // Mask bit 3 (4 bytes, little-endian).
  optional uint32 loaded_accounts_data_size_limit = 3;
  // Mask bit 4 (4 bytes, little-endian). Must be a multiple of 1024 in [32 KiB, 256 KiB].
  optional uint32 heap_size = 4;
}

// Message contains the transaction data
message TransactionMessage {
  reserved 1;

  MessageHeader header = 2;

  // Vector of pubkeys
  repeated bytes account_keys = 3;

  // Recent blockhash provided in message
  bytes recent_blockhash = 5;

  // The instructions this transaction executes
  repeated CompiledInstruction instructions = 6;

  // Not available in legacy message
  repeated MessageAddressTableLookup address_table_lookups = 7;

  // The message version
  TransactionVersion version = 8;

  // Transaction V1 configuration. Ignored for non-V1 transactions.
  TransactionConfig v1_config = 9;
}

// A valid verified transaction
message SanitizedTransaction {
  // The transaction information
  TransactionMessage message = 1;
  // The message hash
  bytes message_hash = 2;
  // The signatures needed in the transaction
  repeated bytes signatures = 4;
}

/* Bank fields relevant to transaction execution */
message TxnBank {
  // Up to 300 (actually 301) most recent blockhashes (ordered from oldest to newest)
  repeated BlockhashQueueEntry blockhash_queue = 1;

  uint32 rbh_lamports_per_signature = 2;

  FeeRateGovernor fee_rate_governor = 3;

  uint64 total_epoch_stake = 4;

  reserved 5, 6;

  FeatureSet features = 7;

  reserved 8;
}

// This Transaction context be used to fuzz either `load_execute_and_commit_transactions`,
// `load_and_execute_transactions` in `bank.rs` or `load_and_execute_sanitized_transactions`
// in `svm/transaction_processor.rs`
message TxnContext {
  // The transaction data
  SanitizedTransaction tx = 1;

  // Data associated with transaction accounts, sysvars, etc.
  repeated AcctState account_shared_data = 2;

  reserved 3, 4, 5;

  /* Bank fields for the transaction fuzzer */
  TxnBank bank = 6;
}

message FeeDetails {
  uint64 transaction_fee = 1;
  uint64 prioritization_fee = 2;
}

// The execution results for a transaction
message TxnResult {
  // Whether this transaction was executed
  bool executed = 1;

  reserved 2, 3, 4, 5;

  // The transaction status (error code)
  uint32 txn_error = 6;
  // The instruction error, if any
  uint32 instruction_error = 7;
  // The instruction error index, if any
  uint32 instruction_error_index = 8;
  // Custom error, if any
  uint32 custom_error = 9;

  reserved 10;
  reserved "return_data";

  // 8-byte XXH64 hash (seed 0) of the transaction return data, or 0 if empty.
  fixed64 return_data_hash = 16;
  // Number of executed compute units
  uint64 executed_units = 11;
  // The collected fees in this transaction
  FeeDetails fee_details = 12;
  // Loaded accounts data size
  uint64 loaded_accounts_data_size = 13;

  repeated AcctState modified_accounts = 14;
  repeated AcctState rollback_accounts = 15;
}

// Txn fixtures
message TxnFixture {
  FixtureMetadata metadata = 1;
  // Context
  TxnContext input = 2;
  // Effects
  TxnResult output = 3;
}
