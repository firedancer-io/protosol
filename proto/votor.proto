syntax = "proto3";
package org.solana.sealevel.v1;

import "metadata.proto";

/* Field numbers match the wire tags */
enum VotorVoteKind {
  VOTOR_VOTE_KIND_UNSPECIFIED = 0;
  VOTOR_VOTE_KIND_NOTAR = 1;
  VOTOR_VOTE_KIND_FINAL = 2;
  VOTOR_VOTE_KIND_SKIP = 3;
  VOTOR_VOTE_KIND_NOTAR_FALLBACK = 4;
  VOTOR_VOTE_KIND_SKIP_FALLBACK = 5;
}

message VotorVote {
  VotorVoteKind kind = 1;
  uint64 slot = 2;
  /* Exactly 32 bytes; ignored for kinds that carry no block */
  bytes block_id = 3;
  /* 192 bytes, an uncompressed G2 point, as on the wire */
  bytes signature = 4;
}

/* Field numbers are the wire tag minus six */
enum VotorCertKind {
  VOTOR_CERT_KIND_UNSPECIFIED = 0;
  VOTOR_CERT_KIND_FINAL = 1;
  VOTOR_CERT_KIND_FAST_FINAL = 2;
  VOTOR_CERT_KIND_NOTAR = 3;
  VOTOR_CERT_KIND_NOTAR_FALLBACK = 4;
  VOTOR_CERT_KIND_SKIP = 5;
}

message VotorCert {
  VotorCertKind kind = 1;
  uint64 slot = 2;
  /* Exactly 32 bytes; zero for kinds that carry no block */
  bytes block_id = 3;
  /* Base2 signer bitmaps by rank; fallback only for notar fallback and skip */
  bytes primary_bitmap = 4;
  bytes fallback_bitmap = 5;
  /* Aggregate signature, 192 bytes uncompressed, as on the wire */
  bytes signature = 6;
}

/* Receive: datagrams run in order through each node's receive path and pool */
message VotorDatagram {
  /* Index into validator_stakes; out of range is an unknown sender */
  uint32 sender = 1;
  /* Raw wire bytes, a vote or a cert */
  bytes data = 2;
}

message VotorReceiveContext {
  /* Processed in this order */
  repeated VotorDatagram datagrams = 1;
  uint64 root_slot = 2;
  uint32 shred_version = 3;
  uint64 highest_parent_ready_slot = 4;
  /* Stake of validator i (at most 16); its keys are fixed by the harness */
  repeated uint64 validator_stakes = 5;
}

/* A cert the pool holds, with its signature as an 8-byte XXH64 hash (seed 0) */
message VotorReceiveCert {
  VotorCertKind kind = 1;
  uint64 slot = 2;
  /* Exactly 32 bytes; zero for kinds that carry no block */
  bytes block_id = 3;
  /* Base2 signer bitmaps by rank; fallback only for notar fallback and skip */
  bytes primary_bitmap = 4;
  bytes fallback_bitmap = 5;
  fixed64 signature_hash = 6;
}

message VotorReceiveEffects {
  /* One per datagram: was it added to the consensus pool */
  repeated bool results = 1;
  /* Certs the pool holds at the end, sorted by kind, slot, block_id */
  repeated VotorReceiveCert certs = 2;
  /* Senders banned at the end, sorted */
  repeated uint32 banned = 3;
}

message VotorReceiveFixture {
  FixtureMetadata metadata = 1;
  VotorReceiveContext input = 2;
  VotorReceiveEffects output = 3;
}

/* Vote serialize: the wire message and signing payload of a vote */
message VotorVoteSerializeContext {
  VotorVote vote = 1;
  uint32 shred_version = 2;
}

message VotorVoteSerializeEffects {
  /* Wire message as sent over QUIC */
  bytes wire = 1;
  /* Bytes the BLS signature is computed over */
  bytes signing_payload = 2;
  /* Not a vote production builds; nothing was serialized */
  bool skipped = 3;
  /* The serializer rejected a vote production builds */
  bool refused = 4;
}

message VotorVoteSerializeFixture {
  FixtureMetadata metadata = 1;
  VotorVoteSerializeContext input = 2;
  VotorVoteSerializeEffects output = 3;
}

/* Cert serialize: the wire message of a cert */
message VotorCertSerializeContext {
  VotorCert cert = 1;
  uint32 shred_version = 2;
}

message VotorCertSerializeEffects {
  /* Wire message as sent over QUIC */
  bytes wire = 1;
  /* Not a cert a pool builds; nothing was serialized */
  bool skipped = 2;
}

message VotorCertSerializeFixture {
  FixtureMetadata metadata = 1;
  VotorCertSerializeContext input = 2;
  VotorCertSerializeEffects output = 3;
}
